name: Build and release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.4.2)"
        required: true
        default: "v1.4.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Temporary cloud API contract probe
        run: |
          {
            set -x
            base="https://bitvoid-cloud-api.onrender.com"
            for path in /health /api/v1/health /api/node /api/users /api/v1/auth/me /api/v1/conversations; do
              curl --silent --show-error --max-time 45 --include "$base$path" || true
              echo
            done
            for path in /api/users/register /api/v1/auth/register /api/v1/auth/login; do
              curl --silent --show-error --max-time 45 --include \
                --request OPTIONS "$base$path" || true
              echo
              curl --silent --show-error --max-time 45 --include \
                --request POST --header 'Content-Type: application/json' \
                --data '{}' "$base$path" || true
              echo
            done
          } > /tmp/cloud-contract.txt 2>&1
          diagnostic="$(tail -c 3500 /tmp/cloud-contract.txt)"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Temporary cloud API contract::$diagnostic"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create debug keystore (CI has no keystore checked in)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Test Raspberry Pi mesh coordinator
        run: python3 -m unittest discover -s controllers/pi/tests -v

      - name: Build ESP32 mesh coordinator firmware
        run: |
          python3 -m venv /tmp/bitvoid-platformio
          /tmp/bitvoid-platformio/bin/pip install platformio
          cp controllers/esp32/include/bitvoid_config.example.h controllers/esp32/include/bitvoid_config.h
          /tmp/bitvoid-platformio/bin/python -m platformio run --project-dir controllers/esp32

      - name: Test and build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-validation.log
          validation_status=${PIPESTATUS[0]}
          set -e
          if [ "$validation_status" -ne 0 ]; then
            # Include JUnit's exact assertion messages before publishing the capped failure tail.
            find app/build/test-results -type f -name '*.xml' -exec grep -H -A 8 '<failure' {} \; 2>/dev/null | tee -a android-validation.log || true
            # GitHub check annotations are capped at 4 KB; keep the actual Gradle/JUnit failure tail.
            diagnostic="$(tail -c 3500 android-validation.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error file=app/build.gradle.kts,title=Android validation failed::$diagnostic"
          fi
          exit "$validation_status"

      - name: Resolve release tag
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
            echo "name=v${app_version}-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: cp app/build/outputs/apk/debug/app-debug.apk "BitVoid-${{ steps.tag.outputs.name }}.apk"

      - name: Remove older releases
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="${{ steps.tag.outputs.name }}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            if [ "$tag" != "$current_tag" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done

      - name: Create release and upload APK
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: BitVoid ${{ steps.tag.outputs.name }}
          files: BitVoid-${{ steps.tag.outputs.name }}.apk
          generate_release_notes: true
          overwrite_files: true
