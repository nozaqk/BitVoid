name: Build and release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.4.2)"
        required: true
        default: "v1.4.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create debug keystore (CI has no keystore checked in)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Test and build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-validation.log
          validation_status=${PIPESTATUS[0]}
          set -e
          if [ "$validation_status" -ne 0 ]; then
            diagnostic="$(tail -c 30000 android-validation.log)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error file=app/build.gradle.kts,title=Android validation failed::$diagnostic"
          fi
          exit "$validation_status"

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
            echo "name=v${app_version}-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "BitVoid-${{ steps.tag.outputs.name }}.apk"

      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="${{ steps.tag.outputs.name }}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            if [ "$tag" != "$current_tag" ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done

      - name: Create release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: BitVoid ${{ steps.tag.outputs.name }}
          files: BitVoid-${{ steps.tag.outputs.name }}.apk
          generate_release_notes: true
          overwrite_files: true
